name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Third-party actions are pinned by commit SHA: a tag can be moved, a SHA cannot.
jobs:
  build:
    name: Build and test (JDK 25)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: ./mvnw -B -ntp verify

  embeddable-java17:
    name: spi and core on JDK 17 (ADR-0021)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: ./mvnw -B -ntp -pl pregon-spi,pregon-core verify

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The official binary, verified by checksum. gitleaks-action needs a license for organizations.
      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" gitleaks
      - name: Scan the full history
        run: ./gitleaks git --redact --verbose --exit-code 1 .

  stt-sidecar:
    name: STT sidecar tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: stt-sidecar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            stt-sidecar/requirements.txt
            stt-sidecar/requirements-dev.txt
      # The engine tests load the real `tiny` model; the download is cached between runs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ github.workspace }}/.models
          key: whisper-tiny-${{ hashFiles('stt-sidecar/requirements.txt') }}
      - run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q
        env:
          PREGON_STT_MODEL_DIR: ${{ github.workspace }}/.models

  api-contract:
    name: API contract lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # ADR-0003: api/openapi.yaml is the source of truth, so it must always be valid.
      - run: npx --yes @redocly/cli@2.55.0 lint --config api/redocly.yaml api/openapi.yaml stt-sidecar/openapi.yaml

  compose-smoke:
    name: Compose lite smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Compose refuses to start without the database password (ADR-0020)
        run: |
          if docker compose -f deploy/docker-compose.yml --profile lite config > /dev/null 2>&1; then
            echo "compose accepted a missing POSTGRES_PASSWORD"; exit 1
          fi
      - name: Create deploy/.env with a throwaway password
        run: |
          cp deploy/.env.example deploy/.env
          sed -i "s|^POSTGRES_PASSWORD=$|POSTGRES_PASSWORD=$(openssl rand -hex 24)|" deploy/.env
      # The sidecar downloads the `small` model (about 460 MB) on first start before it is healthy.
      - name: Start the lite profile and wait until every service is healthy
        run: docker compose -f deploy/docker-compose.yml --profile lite up -d --build --wait --wait-timeout 600
      - name: Server is ready from the host
        run: curl -fsS http://localhost:8080/actuator/health/readiness
      - name: Readiness drops when Valkey stops, liveness stays up
        run: |
          docker compose -f deploy/docker-compose.yml --profile lite stop valkey
          sleep 5
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/readiness)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/actuator/health/liveness)" = 200
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml --profile lite logs --no-color
      - name: Tear down
        if: always()
        run: docker compose -f deploy/docker-compose.yml --profile lite down -v
