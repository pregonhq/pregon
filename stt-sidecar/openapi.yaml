openapi: 3.1.1
info:
  title: Pregón STT sidecar
  version: 0.2.0
  summary: Internal speech-to-text service used by the Pregón server (ADR-0015).
  description: |
    Internal API between the Pregón server and its speech-to-text sidecar. It is not exposed
    outside the deployment and has no authentication of its own.

    Audio is processed in memory and never written to disk (ADR-0006). Transcripts are returned
    to the caller and not kept; the sidecar logs segment ids and durations, never text.

    **Errors** use Problem Details (RFC 9457) with the `application/problem+json` media type.
  license:
    name: Apache 2.0
    identifier: Apache-2.0

# No authentication: the sidecar is reachable only from the deployment's internal network.
security: []

servers:
  - url: http://stt:8000
    description: Service name inside the Docker Compose network

paths:
  /health:
    get:
      operationId: getHealth
      summary: Readiness of the sidecar
      description: |
        `200` once the model is loaded and transcription can be served, `503` while the model is
        still being downloaded or loaded. Docker Compose waits for the `200`, so the server never
        hands jobs to a sidecar that cannot take them.
      responses:
        '200':
          description: The sidecar is ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: UP
                model: small
                device: cpu
                computeType: int8
        '503':
          description: The sidecar is up but the model is not loaded yet, or failed to load.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: DOWN
                model: small
                device: cpu
                computeType: int8
                detail: downloading model

  /v1/transcriptions:
    post:
      operationId: transcribe
      summary: Transcribe a batch of speech segments
      description: |
        One request carries several segments so that the server can drain its queue in batches
        (ADR-0024 §8). The body is `multipart/form-data`:

        - a part named `request` with the JSON `TranscriptionRequest`;
        - one part **per segment, named with the segment id**, containing its Ogg/Opus audio.
          The id is the part name, so audio and metadata cannot be paired by position.

        All segments share the `language` (ADR-0008) and the optional `prompt`: the campaign
        phrases the server wants Whisper to recognise, passed as the model's initial prompt
        (ADR-0007). Whisper reads only the last 224 tokens of a prompt.

        Each segment is transcribed independently and reported with its own `status`, so one
        undecodable audio does not fail the batch. The request as a whole is rejected only when
        it is malformed (`400`), too large (`413`) or when the model is not ready (`503`).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [request]
              properties:
                request:
                  $ref: '#/components/schemas/TranscriptionRequest'
              additionalProperties:
                description: One Ogg/Opus part per segment, named with the segment id.
                type: string
                contentMediaType: audio/ogg
                contentEncoding: binary
            encoding:
              request:
                contentType: application/json
      responses:
        '200':
          description: One result per requested segment, in request order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TranscriptionResponse'
        '400':
          description: |
            Malformed request: missing or invalid `request` part, a segment without its audio
            part, an audio part without its segment, a duplicate id, an unsupported `language`,
            or more segments than the sidecar accepts per request.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '413':
          description: An audio part is larger than the configured limit.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: The model is not loaded yet. Retry after the health probe reports `UP`.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

components:
  schemas:
    Health:
      type: object
      required: [status, model, device, computeType]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
        model:
          description: Whisper model size or path, from `PREGON_STT_MODEL`.
          type: string
        device:
          type: string
        computeType:
          type: string
        detail:
          description: Why the sidecar is `DOWN`, when it is.
          type: string

    TranscriptionRequest:
      type: object
      required: [language, segments]
      properties:
        language:
          description: BCP 47 primary language subtag of the speech, fixed per installation (ADR-0008).
          type: string
          pattern: '^[a-z]{2,3}$'
          examples: [es]
        prompt:
          description: |
            Text fed to the model as initial prompt: campaign phrases and product names, so that
            they are transcribed as written. Optional; empty means no prompt.
          type: string
          maxLength: 2000
        segments:
          description: Ids of the segments in this batch. Each id names a multipart part with its audio.
          type: array
          minItems: 1
          maxItems: 64
          uniqueItems: true
          items:
            type: string
            format: uuid

    TranscriptionResponse:
      type: object
      required: [model, results]
      properties:
        model:
          type: string
        results:
          type: array
          items:
            $ref: '#/components/schemas/TranscriptionResult'

    TranscriptionResult:
      description: |
        Outcome for one segment. `transcribed` carries the transcript; `failed` carries the reason
        and nothing else. A transcript may be empty: Whisper found no speech worth writing.
      type: object
      required: [id, status]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [transcribed, failed]
        text:
          description: Full transcript, normalised whitespace, model casing and punctuation.
          type: string
        language:
          description: Language the model used (the requested one).
          type: string
        duration:
          description: Decoded audio length in seconds.
          type: number
        segments:
          description: Whisper segments with timing and confidence, for the server's own gating.
          type: array
          items:
            $ref: '#/components/schemas/TranscriptSegment'
        processingMillis:
          description: Wall-clock time the model spent on this segment.
          type: integer
        error:
          description: Why the segment `failed`, e.g. the audio could not be decoded.
          type: string

    TranscriptSegment:
      type: object
      required: [start, end, text, avgLogprob, noSpeechProb, compressionRatio]
      properties:
        start:
          description: Seconds from the beginning of the audio.
          type: number
        end:
          type: number
        text:
          type: string
        avgLogprob:
          description: Average log-probability of the tokens; very negative values mean low confidence.
          type: number
        noSpeechProb:
          description: Probability that the segment is not speech; high values flag hallucinated text.
          type: number
          minimum: 0
          maximum: 1
        compressionRatio:
          description: gzip ratio of the text; values above about 2.4 indicate repetition loops.
          type: number

    Problem:
      description: Problem Details for HTTP APIs (RFC 9457).
      type: object
      properties:
        type:
          type: string
          format: uri-reference
          default: about:blank
        title:
          type: string
        status:
          type: integer
          minimum: 100
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          format: uri-reference
