# Connections and secrets have no defaults: a missing one stops startup and names itself (ADR-0020).
spring:
  application:
    name: pregon-server
  datasource:
    url: ${PREGON_DB_URL}
    username: ${PREGON_DB_USER}
    password: ${PREGON_DB_PASSWORD}
  data:
    redis:
      url: ${PREGON_REDIS_URL}
  mvc:
    # Errors raised by Spring MVC (404, 405, 415…) as RFC 9457 Problem Details, like the contract.
    problemdetails:
      enabled: true
  jackson:
    deserialization:
      # A misspelled field is a client bug; ignoring it would silently drop configuration.
      fail-on-unknown-properties: true
  web:
    resources:
      # An API serves no static files; without this a 404 talks about static resources.
      add-mappings: false

server:
  tomcat:
    # A request refused before its body is read does not get its body read anyway (ADR-0025 §4):
    # past this many bytes Tomcat closes the connection instead of swallowing the upload.
    max-swallow-size: 65536

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      # Readiness depends on the stores the server cannot work without; liveness does not,
      # so an outage of PostgreSQL or Valkey takes the server out of rotation without restarting it.
      group:
        readiness:
          include: readinessState, db, redis
